name: run-tests

on:
  push:
    branches: [4.x]
  pull_request:
    branches: [4.x]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest] #, windows-latest]
        php: [8.3, 8.4, 8.5]
        laravel: [12.*, 13.*]
        stability: [prefer-lowest, prefer-stable]
        # The oldest dependency set only needs checking on the oldest PHP.
        exclude:
          - php: 8.4
            stability: prefer-lowest
          - php: 8.5
            stability: prefer-lowest
        include:
          - laravel: 12.*
            testbench: 10.*
            carbon: ^3.8
          - laravel: 13.*
            testbench: 11.*
            carbon: ^3.8

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    # The package's migrations and aggregation queries need PostgreSQL.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: amigo
          POSTGRES_PASSWORD: amigo
          POSTGRES_DB: api_amigo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "nesbot/carbon:${{ matrix.carbon }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --no-coverage

  coverage:
    runs-on: ubuntu-latest
    name: Coverage

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: amigo
          POSTGRES_PASSWORD: amigo
          POSTGRES_DB: api_amigo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: pcov

      - name: Install dependencies
        run: |
          composer require --dev "laravel/framework:13.*" "orchestra/testbench:11.*" "nesbot/carbon:^3.8" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      # Raise the minimum as coverage improves, so it can't quietly drop.
      - name: Execute tests with coverage
        run: vendor/bin/pest --coverage --min=74

      - name: Coverage summary
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sed 's/\x1b\[[0-9;]*m//g' build/coverage.txt | head -9 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
